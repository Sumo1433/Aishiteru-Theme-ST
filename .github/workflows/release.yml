name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(jq -r .version manifest.json)" >> "$GITHUB_ENV"
          fi

      - name: Build archive
        run: |
          git archive --format=zip --prefix=Aishiteru-Theme-ST/ \
            -o "Aishiteru-Theme-ST-${TAG}.zip" HEAD \
            manifest.json index.js style.css frames.css icons.css motion.css \
            theme assets LICENSE README.md README.ru.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "Aishiteru-Theme-ST-${TAG}.zip" \
            --title "Aishiteru Theme ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes.md
